name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/affectionate-volta-7ur8ou
      - main
  workflow_dispatch:

# Publishes the built app to the gh-pages branch. GitHub Pages serves that
# branch automatically, which avoids needing repo-settings access that the
# workflow token does not have (configure-pages enablement fails with
# "Resource not accessible by integration").
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
